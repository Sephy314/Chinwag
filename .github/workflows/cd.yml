name: CD

# Deploys the latest `main` to the home k3s server using a SELF-HOSTED runner
# installed on the k3s node. The runner runs infra/k3s/update.sh natively
# (rebuild images -> import into k3s -> apply -> rollout restart -> verify),
# so docker/k3s/kubectl are all available locally — no inbound SSH, no keys,
# no repo secrets.
#
# update.sh is run with --obs, so every deploy ALSO updates the observability
# stack (observability/install.sh: Loki/Alloy/Prometheus+Alertmanager, the
# Chinwag Notifier, Grafana + dashboards). The notifier image is rebuilt,
# imported and rollout-restarted here, so Discord alerting changes ship with
# every app deploy.
#
# The runner operates on a persistent checkout at ~/Chinwag, which
# must contain the gitignored infra/k3s/secret.yaml (created once from
# secret.yaml.example). See .github/workflows/README.md for runner
# registration and one-time node setup.
#
# Recommended: enable branch protection on `main` requiring the CI workflow
# to pass, so CD only ever ships tested code.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a queued run waits (don't cancel a live rollout).
concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to home server (k3s)
    runs-on: [self-hosted, linux]
    steps:
      - name: Sync repo checkout to origin/main
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/Chinwag"
          cd "${DEPLOY_DIR}"
          echo "==> Syncing ${DEPLOY_DIR} to origin/main"
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main
          git status --short

      - name: Run infra/k3s/update.sh (app + observability stack)
        run: |
          set -euo pipefail
          cd "$HOME/Chinwag/infra/k3s"
          # --obs: also update the observability stack. install.sh rebuilds +
          # imports + rollout-restarts the notifier, and applies the dashboards.
          ./update.sh --obs

      # Send a deploy notification to the Discord "deployments" channel (the
      # same webhook the notifier uses for the `deployments` category). The URL
      # is read from the gitignored infra/k3s/secret.yaml — never committed.
      # Runs on success AND failure (green 🚀 / red 🚨).
      - name: Notify Discord (deployments channel)
        if: always()
        run: |
          set -euo pipefail
          cd "$HOME/Chinwag"
          URL="$(grep -E '^[[:space:]]*DISCORD_WEBHOOK_URL_DEPLOYMENTS:' infra/k3s/secret.yaml | head -1 | sed -E 's/^[[:space:]]*[A-Za-z_]+:[[:space:]]*//; s/^"//; s/"$//')"
          [ -n "$URL" ] || URL="$(grep -E '^[[:space:]]*DISCORD_WEBHOOK_URL:' infra/k3s/secret.yaml | head -1 | sed -E 's/^[[:space:]]*[A-Za-z_]+:[[:space:]]*//; s/^"//; s/"$//')"
          if [ -z "$URL" ]; then
            echo "WARN: no Discord webhook in infra/k3s/secret.yaml — skipping deploy notification"
            exit 0
          fi
          SHA="$(git rev-parse --short HEAD)"
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=5763719; TITLE="🚀 Deploy finished"
          else
            COLOR=15548997; TITLE="🚨 Deploy failed"
          fi
          PAYLOAD="{\"embeds\":[{\"title\":\"$TITLE\",\"description\":\"Commit **$SHA** deployed to production.\",\"color\":$COLOR}]}"
          curl -fsS -m 15 -H 'Content-Type: application/json' -d "$PAYLOAD" "$URL" >/dev/null \
            || echo "WARN: deploy notification to Discord failed" >&2
