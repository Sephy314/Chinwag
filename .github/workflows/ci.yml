name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.work
          cache: true
          cache-dependency-path: |
            backend/go.work.sum
            backend/**/go.sum

      # Runs `go test` for every module in the Go workspace that has tests.
      # (The only live-DB test, projectionRepo_test.go, self-skips when no DB.)
      - name: Run tests (make test)
        run: make test

      - name: Run go vet (make vet)
        run: make vet

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (vitest)
        run: npm test

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (next build)
        run: npm run build

  # Real K3s infrastructure integration test (infra/test.sh): applies the
  # kustomize manifests to a real cluster, waits for readiness and runs runtime
  # checks (Service DNS, health endpoints, gateway proxy, Traefik Ingress).
  #
  # GitHub-hosted runners have NO access to a K3s cluster, so this never runs on
  # ubuntu-latest. It runs on the existing SELF-HOSTED runner (the same one used
  # by cd.yml, which sits on the k3s node and has kubectl + helm access) after
  # every merge to main and on manual dispatch — i.e. it verifies the deployed
  # production cluster. It is intentionally NOT run on PRs (the runner points at
  # the production cluster and test.sh applies the manifests).
  #
  # infra/k3s/secret.yaml is gitignored, so a fresh actions/checkout does not
  # contain it; it is copied from the runner's persistent CD checkout
  # (~/Chinwag — see cd.yml DEPLOY_DIR) which preserves it across resets.
  k3s-infra:
    name: K3s Infrastructure
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      - name: Copy gitignored secret.yaml (from persistent CD checkout)
        run: |
          if [ -f "$HOME/Chinwag/infra/k3s/secret.yaml" ]; then
            cp "$HOME/Chinwag/infra/k3s/secret.yaml" infra/k3s/secret.yaml
            echo "secret.yaml copied from \$HOME/Chinwag"
          else
            echo "::warning::infra/k3s/secret.yaml not found in \$HOME/Chinwag — the test will fail its prerequisite check"
          fi

      - name: Run K3s infrastructure test
        run: |
          chmod +x infra/test.sh
          ./infra/test.sh
