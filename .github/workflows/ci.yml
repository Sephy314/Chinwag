name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.work
          cache: true
          cache-dependency-path: |
            backend/go.work.sum
            backend/**/go.sum

      # Runs `go test` for every module in the Go workspace that has tests.
      # (The only live-DB test, projectionRepo_test.go, self-skips when no DB.)
      - name: Run tests (make test)
        run: make test

      - name: Run go vet (make vet)
        run: make vet

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (vitest)
        run: npm test

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (next build)
        run: npm run build

  # Real K3s infrastructure integration test (infra/test.sh): applies the
  # kustomize manifests to a real cluster, waits for readiness and runs runtime
  # checks (Service DNS, health endpoints, gateway proxy, Traefik Ingress).
  #
  # GitHub-hosted runners have NO access to a K3s cluster, so we do not run (or
  # fake) this on ubuntu-latest. Instead it is manual-only (workflow_dispatch)
  # and requires a SELF-HOSTED runner registered with the `k3s` label that has
  # kubectl pointing at a K3s cluster — preferably the dev cluster, NOT the
  # production node used by cd.yml. Until such a runner exists this job simply
  # won't run; it never blocks push/PR CI.
  k3s-infra:
    name: K3s Infrastructure
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, k3s]
    steps:
      - uses: actions/checkout@v5

      - name: Run K3s infrastructure test
        run: |
          chmod +x infra/test.sh
          ./infra/test.sh
