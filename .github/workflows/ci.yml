name: CI

# Triggers:
#   - push on main        -> runs CI for every merge to main
#   - pull_request        -> runs CI for every PR (including pushes to its branch)
#   - workflow_dispatch   -> manual run
#
# NOTE: `push` is intentionally limited to `main`. If it matched all branches
# ("**"), a push to an open PR's branch would fire BOTH a `push` run and a
# `pull_request` run at the same time, and with cancel-in-progress the later
# run would cancel the earlier one (killing long jobs like K3s Infrastructure).
# Limiting push to main avoids that double-trigger entirely.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Group by event + ref so a `push` run and a `pull_request` run on the same
# branch never cancel each other. Same event+ref still cancels in-progress runs
# (e.g. a second push to the same branch supersedes the first).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.work
          cache: true
          cache-dependency-path: |
            backend/go.work.sum
            backend/**/go.sum

      # Runs `go test` for every module in the Go workspace that has tests.
      # (The only live-DB test, projectionRepo_test.go, self-skips when no DB.)
      - name: Run tests (make test)
        run: make test

      - name: Run go vet (make vet)
        run: make vet

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (vitest)
        run: npm test

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (next build)
        run: npm run build

  # Real K3s infrastructure integration test (infra/test.sh) against an
  # EPHEMERAL k3d cluster (infra/ci-test.sh), so it runs on EVERY push and PR
  # on GitHub-hosted runners — no self-hosted runner needed.
  #
  # GitHub-hosted runners have Docker but no permanent cluster, so ci-test.sh:
  # creates a throwaway k3d cluster, installs cert-manager (kustomize needs its
  # CRDs), generates a dummy secret.yaml, builds + imports the Chinwag images,
  # and runs infra/test.sh against it. The dev and production clusters are
  # never touched, which is why this is safe to run on PRs (unlike the old
  # self-hosted job, which pointed at production and had to stay skip-on-PR).
  #
  # infra/k3s/secret.yaml is gitignored; ci-test.sh generates a self-consistent
  # dummy one when the checkout has none, so a fresh checkout works.
  k3s-infra:
    name: K3s Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx (GHA layer cache)
        uses: docker/setup-buildx-action@v3

      - name: Run K3s infrastructure test (ephemeral k3d cluster)
        run: |
          chmod +x infra/ci-test.sh
          ./infra/ci-test.sh
