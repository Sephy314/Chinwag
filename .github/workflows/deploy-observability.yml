name: Deploy Observability

# On-demand reinstall/update of the observability stack (Loki + Grafana Alloy +
# Prometheus + Alertmanager + Notifier + Grafana) on the production node.
#
# CD (cd.yml) already updates the observability stack on every deploy via
# `update.sh --obs` (which runs observability/install.sh). This workflow is a
# manual fallback: run it from the Actions tab when you want to re-run the obs
# install without a full app deploy (Actions -> "Deploy Observability" ->
# Run workflow).
#
# The job runs on the SAME self-hosted runner as CD (installed on the k3s node),
# operating on the persistent checkout at ~/Chinwag, which must contain the
# gitignored infra/k3s/secret.yaml. See .github/workflows/README.md.

on:
  workflow_dispatch:

# Only one obs deploy at a time; a queued run waits (don't cancel a live rollout).
concurrency:
  group: cd-observability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-observability:
    name: Deploy observability stack to home server (k3s)
    runs-on: [self-hosted, linux]
    steps:
      - name: Sync repo checkout to origin/main
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/Chinwag"
          cd "${DEPLOY_DIR}"
          echo "==> Syncing ${DEPLOY_DIR} to origin/main"
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main
          git status --short

      - name: Run observability/install.sh
        run: |
          set -euo pipefail
          cd "$HOME/Chinwag/infra/k3s/observability"
          ./install.sh
