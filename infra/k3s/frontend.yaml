# ---------------------------------------------------------------------------
# Frontend — Next.js standalone server.
# NEXT_PUBLIC_WS_URL is baked into the image at BUILD time (see
# frontend/Dockerfile) and must match the externally reachable WS origin.
# GATEWAY_URL is read at runtime by src/proxy.ts to rewrite API calls.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chinwag
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: chinwag/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: chinwag-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chinwag
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
