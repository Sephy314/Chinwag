# ---------------------------------------------------------------------------
# Chat Query Service — message reads / CQRS projection.
# Runs DB migrations at startup (goose). Depends on postgres, redis, nats
# (chat-projection consumer) and room (member lookups) + auth JWKS.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-query
  namespace: chinwag
  labels:
    app: chat-query
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-query
  template:
    metadata:
      labels:
        app: chat-query
    spec:
      containers:
        - name: chat-query
          image: chinwag/chat-query:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: chinwag-config
          env:
            - name: CHAT_QUERY_DB_URL
              valueFrom:
                secretKeyRef:
                  name: chinwag-secrets
                  key: CHAT_QUERY_DB_URL
            - name: REDIS_PW
              valueFrom:
                secretKeyRef:
                  name: chinwag-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /chat/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /chat/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-query
  namespace: chinwag
spec:
  selector:
    app: chat-query
  ports:
    - name: http
      port: 8084
      targetPort: http
