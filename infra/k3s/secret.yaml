# ---------------------------------------------------------------------------
# Secrets. `stringData` is used for readability; kubectl base64-encodes it.
#
# ⚠️  The values below are LOCAL-DEV DEFAULTS. Rotate them before any
#     non-local deployment, e.g.:
#       kubectl -n chinwag create secret generic chinwag-secrets \
#         --from-literal=POSTGRES_PASSWORD='<strong>' \
#         --from-literal=REDIS_PASSWORD='<strong>' \
#         --dry-run=client -o yaml | kubectl apply -f -
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: chinwag-secrets
  namespace: chinwag
type: Opaque
stringData:
  # PostgreSQL superuser password (user: chinwag) and Redis password.
  POSTGRES_PASSWORD: "chinwag-dev-password"
  REDIS_PASSWORD: "chinwag-dev-redis"

  # Full connection strings per service schema. All point at the single
  # postgres StatefulSet (see postgres.yaml) which creates the 4 databases.
  AUTH_DB_URL: "postgres://chinwag:chinwag-dev-password@postgres:5432/chinwag_auth?sslmode=disable"
  ROOM_DB_URL: "postgres://chinwag:chinwag-dev-password@postgres:5432/chinwag_room?sslmode=disable"
  CHAT_DB_URL: "postgres://chinwag:chinwag-dev-password@postgres:5432/chinwag_chat?sslmode=disable"
  CHAT_QUERY_DB_URL: "postgres://chinwag:chinwag-dev-password@postgres:5432/chinwag_chat_projection?sslmode=disable"

  # Optional Google OAuth. Leave empty to disable (auth service checks
  # IsValid() and only mounts the /auth/google* routes when all three are set).
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_REDIRECT_URL: ""
