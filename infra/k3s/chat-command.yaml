# ---------------------------------------------------------------------------
# Chat Command Service — message writes, outbox → NATS, WebSocket hub.
# Runs DB migrations at startup (goose). Depends on postgres, redis, nats,
# auth (user lookups + JWKS) and room (member lookups).
#
# INSTANCE_ID is pinned to the pod name (fieldRef) so the durable JetStream
# consumer name (chat-ws-<instance>) stays stable across pod restarts.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-command
  namespace: chinwag
  labels:
    app: chat-command
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-command
  template:
    metadata:
      labels:
        app: chat-command
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - "i=0; until nc -z postgres 5432; do i=$((i+1)); [ $i -ge 150 ] && { echo 'postgres not ready'; exit 1; }; echo 'waiting for postgres'; sleep 2; done"
        - name: wait-redis
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - "i=0; until nc -z redis 6379; do i=$((i+1)); [ $i -ge 150 ] && { echo 'redis not ready'; exit 1; }; echo 'waiting for redis'; sleep 2; done"
        - name: wait-nats
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - "i=0; until nc -z nats 4222; do i=$((i+1)); [ $i -ge 150 ] && { echo 'nats not ready'; exit 1; }; echo 'waiting for nats'; sleep 2; done"
      containers:
        - name: chat-command
          image: chinwag/chat-command:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: chinwag-config
          env:
            - name: CHAT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: chinwag-secrets
                  key: CHAT_DB_URL
            - name: REDIS_PW
              valueFrom:
                secretKeyRef:
                  name: chinwag-secrets
                  key: REDIS_PASSWORD
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /chat/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /chat/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-command
  namespace: chinwag
spec:
  selector:
    app: chat-command
  ports:
    - name: http
      port: 8083
      targetPort: http
