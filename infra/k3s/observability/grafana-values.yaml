# =============================================================================
# Grafana — Grafana Helm chart 10.5.15 (Grafana 12.3.1)
# Data sources: Loki (logs, default) + Prometheus (metrics).
# Served publicly at https://chinwag.duckdns.org/grafana (Traefik ingress + TLS).
# Installed into the `monitoring` namespace:
#   helm upgrade --install grafana grafana/grafana -n monitoring -f grafana-values.yaml
# =============================================================================

# Admin credentials come from a Secret created at install time (never committed
# to Git). See install.sh / README:
#   kubectl -n monitoring create secret generic grafana-admin \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='<strong-password>'
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# Auto-provision datasources: Loki (default, logs) + Prometheus (metrics).
# URLs use Kubernetes internal Service DNS.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # No explicit uid — Grafana matches provisioned datasources by name and
      # updates the existing (readOnly) entry in place. Explicit uids would
      # clash with the already-provisioned readOnly datasource and crash the
      # datasource provisioning with "data source not found".
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: true
        jsonData:
          maxLines: 1000
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local:80
        isDefault: false
        jsonData:
          timeInterval: 15s

# Provisioned dashboards (loaded from the `grafana-dashboards` ConfigMap, which
# is created by install.sh from ./dashboards/*.json). Chart format for this key
# is a map of folderName -> configMapName (the template mounts the configMap
# named by the VALUE into the folder named by the KEY). The folder name must be
# lowercase — it becomes part of a Kubernetes volume name.
dashboardsConfigMaps:
  chinwag: grafana-dashboards

# File provider that scans the mounted dashboard ConfigMaps
# (/var/lib/grafana/dashboards/<folder>). Without a provider, Grafana mounts
# the ConfigMaps but never loads the dashboards.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: chinwag
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          foldersFromFilesStructure: true
          path: /var/lib/grafana/dashboards

# ClusterIP Service — the ingress routes https://chinwag.duckdns.org/grafana
# to this service. Not exposed directly (no NodePort/LoadBalancer).
service:
  type: ClusterIP
  port: 80

# Public access — served at https://chinwag.duckdns.org/grafana via the k3s
# Traefik ingress + cert-manager (TLS). The `grafana-tls` Certificate (see
# grafana-certificate.yaml) is issued by the `letsencrypt` ClusterIssuer for
# the same domain, so the browser shows a valid cert. Plain HTTP :80 /grafana
# is redirected to HTTPS by the existing chinwag-redirect ingress. The path
# prefix is NOT stripped — Grafana serves itself from the /grafana subpath
# (see grafana.ini -> server below). Chart format: hosts = list of strings,
# single `path` (see chart values.yaml).
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - chinwag.duckdns.org
  path: /grafana
  pathType: Prefix
  tls:
    - hosts:
        - chinwag.duckdns.org
      secretName: grafana-tls

# Single replica with an RWO PVC (below): use Recreate so `helm upgrade --wait`
# does not deadlock. With RollingUpdate (chart default), the new pod cannot
# attach the RWO PVC until the old pod is gone, but the old pod is only torn
# down after the new pod is Ready -> "Pending termination: 1 / context deadline
# exceeded". Recreate terminates the old pod first, which is fine here (brief
# Grafana downtime during upgrades).
#
# rollingUpdate: null is REQUIRED alongside Recreate: server-side apply keeps
# fields it previously owned unless they are explicitly removed. An upgrade
# that only flips type to Recreate leaves the old `strategy.rollingUpdate`
# block on the live Deployment, which the API server rejects with
# "rollingUpdate: Forbidden: may not be specified when strategy 'type' is
# 'Recreate'". Setting it to null tells SSA to drop the field.
deploymentStrategy:
  type: Recreate
  rollingUpdate: null

# Persist Grafana config/dashboards/plugins on the node (local-path).
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi

# Skip the init-chown-data container. The chart's init container runs as
# uid 0 with ONLY the CHOWN capability (no CAP_DAC_OVERRIDE) and the pod
# fsGroup 472, so once the PVC already holds data dirs (csv/png/pdf are
# mode 700 owned by 472:472) it cannot recurse into them and fails with
# "chown: ... Permission denied". Ownership is already 472:472 (the grafana
# process runs as 472 and writes fine), so the chown is unnecessary.
initChownData:
  enabled: false

# Security: keep anonymous access off, default org role for new users = Viewer.
# server.root_url + serve_from_sub_path make Grafana correctly serve its UI,
# assets and API under the /grafana subpath behind the Traefik ingress.
grafana.ini:
  server:
    root_url: https://chinwag.duckdns.org/grafana
    serve_from_sub_path: true
  auth.anonymous:
    enabled: false
  users:
    auto_assign_org_role: Viewer

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
