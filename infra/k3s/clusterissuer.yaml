# ---------------------------------------------------------------------------
# cert-manager ClusterIssuers for Chinwag TLS.
#
# cert-manager manages the whole certificate lifecycle in-cluster: it issues
# the `chinwag-tls` secret used by the Traefik ingress and AUTO-RENEWS it
# before expiry — no cron or manual step needed (replaces the old tls.sh).
#
#   - chinwag-selfsigned : bootstrap issuer used only to mint the local CA.
#   - chinwag-ca         : namespaced CA Issuer that signs INTERNAL certs
#                          (postgres-tls) from the self-signed local CA.
#   - letsencrypt        : ACME (Let's Encrypt) ClusterIssuer that issues the
#                          PUBLIC, browser-trusted cert (chinwag-tls) for
#                          chinwag.duckdns.org and auto-renews it.
# ---------------------------------------------------------------------------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: chinwag-selfsigned
spec:
  selfSigned: {}
---
# chinwag-ca is a NAMESPACED Issuer (not a ClusterIssuer) because the CA secret
# lives in the `chinwag` namespace — a CA ClusterIssuer cannot resolve a secret
# outside its own (empty) namespace and fails with `secrets "..." not found`.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: chinwag-ca
  namespace: chinwag
spec:
  ca:
    secretName: chinwag-ca
---
# Let's Encrypt (ACME) — issues the PUBLIC, browser-trusted `chinwag-tls` cert
# for chinwag.duckdns.org and auto-renews it.
#
# DNS-01 via the duckdns webhook (cert-manager-webhook-duckdns, see
# duckdns-webhook.yaml): it sets a duckdns TXT record for validation, so NO
# inbound :80/:443 or router hairpin NAT is needed. Requires a duckdns API
# token in the secret `duckdns-credentials` (namespace cert-manager), e.g.:
#   kubectl -n cert-manager create secret generic duckdns-credentials \
#     --from-literal=token='<duckdns-token>'
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: rdy00328@gmail.com
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          webhook:
            groupName: acme.duckdns.org
            solverName: duckdns
            config:
              apiTokenSecretRef:
                name: duckdns-credentials
                key: token
