# ---------------------------------------------------------------------------
# Traefik Ingress (k3s default ingress controller), TLS on :443 — FRONTEND
# pages only.
#
# API/WebSocket traffic goes through the separate `chinwag-api` ingress under
# the `/api` prefix (see ingress-api.yaml), which strips `/api` and forwards
# to the gateway. Keeping the page paths (/chat/<roomId>, /settings, ...) on
# this ingress to the frontend avoids the /chat prefix clash with the gateway.
#
#   /chat, /  → frontend
#   /api      → gateway (ingress-api.yaml, prefix stripped)
#
# HTTPS uses the browser-trusted `chinwag-tls` certificate (issued by the
# `letsencrypt` ClusterIssuer for chinwag.duckdns.org, see clusterissuer.yaml /
# certificate.yaml). Plain HTTP on :80 is handled by ingress-redirect.yaml
# (redirect to https) — see middleware.yaml.
#
# No `host` in rules: the ingress matches any host, so it also answers for the
# node IP / LAN without an /etc/hosts entry.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chinwag
  namespace: chinwag
  annotations:
    # Traefik listens on the websecure entrypoint (port 443) in k3s.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - chinwag.duckdns.org
      secretName: chinwag-tls
  rules:
    - http:
        paths:
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
