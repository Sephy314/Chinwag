# ---------------------------------------------------------------------------
# Single Traefik Ingress (k3s default ingress controller), TLS on :443.
#
# Path routing mirrors the "edge" role that nginx played in the Docker Compose
# design and the gateway's own route table:
#   /auth, /rooms, /users, /chat  → gateway (includes WebSocket upgrade for
#                                   /chat/rooms/:id/ws)
#   /                            → frontend
#
# HTTPS uses a self-signed certificate from the `chinwag-tls` secret, which is
# created by `./tls.sh` (idempotent; run it before apply, or deploy.sh does it
# automatically). Plain HTTP on :80 is handled by ingress-redirect.yaml
# (redirect to https) — see middleware.yaml.
#
# Adjust `host` to your node IP / domain. For local access, map it in /etc/hosts:
#   echo "<k3s-node-ip> chinwag.local" | sudo tee -a /etc/hosts
# Then set FRONTEND_URL in configmap.yaml to match (https://chinwag.local).
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chinwag
  namespace: chinwag
  annotations:
    # Traefik listens on the websecure entrypoint (port 443) in k3s.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - chinwag.local
      secretName: chinwag-tls
  rules:
    - host: chinwag.local
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          - path: /rooms
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
