# ---------------------------------------------------------------------------
# Single Traefik Ingress (k3s default ingress controller), TLS on :443.
#
# Path routing mirrors the "edge" role that nginx played in the Docker Compose
# design and the gateway's own route table:
#   /auth, /rooms, /users, /chat  → gateway (includes WebSocket upgrade for
#                                   /chat/rooms/:id/ws)
#   /                            → frontend
#
# HTTPS uses the browser-trusted `chinwag-tls` certificate (issued by the
# `letsencrypt` ClusterIssuer for chinwag.duckdns.org, see clusterissuer.yaml /
# certificate.yaml). Plain HTTP on :80 is handled by ingress-redirect.yaml
# (redirect to https) — see middleware.yaml.
#
# No `host` in rules: the ingress matches any host, so it also answers for the
# node IP / LAN without an /etc/hosts entry. TLS below terminates
# chinwag.duckdns.org via the chinwag-tls secret.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chinwag
  namespace: chinwag
  annotations:
    # Traefik listens on the websecure entrypoint (port 443) in k3s.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - chinwag.duckdns.org
      secretName: chinwag-tls
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          - path: /rooms
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
