# ---------------------------------------------------------------------------
# PostgreSQL — single instance holding the 4 service schemas:
#   chinwag_auth, chinwag_room, chinwag_chat, chinwag_chat_projection
# The official image runs initdb SQL scripts on first boot to create them.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: chinwag
data:
  init.sql: |
    CREATE DATABASE chinwag_auth;
    CREATE DATABASE chinwag_room;
    CREATE DATABASE chinwag_chat;
    CREATE DATABASE chinwag_chat_projection;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chinwag
spec:
  clusterIP: None # headless, paired with the StatefulSet
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: chinwag
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: fix-tls-perms
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - "cp /tls/tls.crt /run/tls/tls.crt && cp /tls/tls.key /run/tls/tls.key && chown postgres:postgres /run/tls/tls.crt /run/tls/tls.key && chmod 0644 /run/tls/tls.crt && chmod 0600 /run/tls/tls.key"
          volumeMounts:
            - name: postgres-tls
              mountPath: /tls
              readOnly: true
            - name: tls-runtime
              mountPath: /run/tls
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - postgres
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/run/tls/tls.crt
            - -c
            - ssl_key_file=/run/tls/tls.key
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "chinwag"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chinwag-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: tls-runtime
              mountPath: /run/tls
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "chinwag", "-d", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "chinwag", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
        - name: postgres-tls
          secret:
            secretName: postgres-tls
        - name: tls-runtime
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path # k3s default provisioner
        resources:
          requests:
            storage: 5Gi
