# ---------------------------------------------------------------------------
# cert-manager Certificates.
#
#   chinwag-ca   -> self-signed local CA           (secret `chinwag-ca`)
#   chinwag-tls  -> PUBLIC cert for the ingress    (secret `chinwag-tls`)
#   postgres-tls -> INTERNAL cert for postgres     (secret `postgres-tls`)
#
# chinwag-tls is issued by the `letsencrypt` ClusterIssuer (browser-trusted,
# auto-renewed) for chinwag.duckdns.org. postgres-tls stays on the internal
# NAMESPACED `Issuer` `chinwag-ca` (see clusterissuer.yaml) since postgres is
# only reachable inside the cluster.
# ---------------------------------------------------------------------------
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: chinwag-ca
  namespace: chinwag
spec:
  isCA: true
  commonName: Chinwag Local CA
  secretName: chinwag-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: chinwag-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: chinwag-tls
  namespace: chinwag
spec:
  secretName: chinwag-tls
  dnsNames:
    - chinwag.duckdns.org
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-tls
  namespace: chinwag
spec:
  secretName: postgres-tls
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - postgres
    - postgres.chinwag.svc
    - postgres.chinwag.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: chinwag-ca
    kind: Issuer
